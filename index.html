    <!--
      The two web fonts, declared here and asked for at once, before the page's own code and styles arrive: the display
      face too, so PORTFOLIO never begins typing in Georgia and swaps to Playfair mid-word on a slow connection
      (2026-09-28). Each is fetched once by the @font-face rule itself in every browser: a <link rel="preload"> with
      crossorigin matched Chrome's request but not WebKit's (same-origin fonts without CORS there), so Safari fetched
      both files twice (Harlie's QA pass, 2026-09-28). The metric-matched fallback stays in tokens.css.
    -->
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/InterVariable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Playfair Display';
        src: url('/fonts/PlayfairDisplay-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <script>
      if (document.fonts) {
        document.fonts.load('400 1em Inter').catch(function () {})
        document.fonts.load('400 1em "Playfair Display"').catch(function () {})
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- The About page's contact form (ContactForm.tsx), declared here too so Netlify Forms finds it at deploy. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <!-- Its links in the site's one blue violet (tokens.css --statement, rgb(118 132 255)); 2026-09-28, was lavender. -->

        or on <a style="color: #7684ff" href="https://www.linkedin.com/in/harliekatz/">LinkedIn</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
