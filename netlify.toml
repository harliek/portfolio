[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.12.0"

# Single-page app fallback: every unknown path serves index.html and the
# client router renders the matching page (or the custom 404).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fingerprinted build assets can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media derivatives are not fingerprinted; cache for a week and revalidate.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
